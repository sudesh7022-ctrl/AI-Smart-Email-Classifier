spring.application.name=classifier

# Database Configuration
spring.datasource.url=jdbc:h2:mem:classifierdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# JWT Secret (Current hardcoded value used as default for local dev)
jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b2a1a4c9c1b7a2bb4d0f1bb65c4fae87c0}
jwt.expiration=86400000

# FastAPI AI Service Endpoint (Default to localhost explicitly)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/predict}
