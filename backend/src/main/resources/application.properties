spring.application.name=classifier

# Database Configuration (File-based H2 database for local persistence)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/classifierdb;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# JWT Secret (Current hardcoded value used as default for local dev)
jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b2a1a4c9c1b7a2bb4d0f1bb65c4fae87c0}
jwt.expiration=86400000

# Google OAuth2 Credentials Placeholder (Requires setting up in Google Cloud Console)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Mail Settings Placeholder (Required to actually send Password Reset emails)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Frontend URL for links in emails
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
